{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card p-4">
            <h3 class="text-center">用户登录</h3>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100">登录</button>
            </form>
            <p class="mt-3 text-center">
                <small>管理员可在后台创建更多用户</small>
            </p>
        </div>
    </div>
</div>
{% endblock %}
