{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card p-4 shadow">
            <h3 class="text-center">新用户注册</h3>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success w-100">立即注册</button>
            </form>
            <p class="mt-3 text-center"><a href="{% url 'login' %}">已有账号？去登录</a></p>
        </div>
    </div>
</div>
{% endblock %}
